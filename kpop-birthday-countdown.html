/* ── DESIGN TOKENS ─────────────────────────────────────────
   Layout: sticky group-tab rail + scrollable idol card grid
   Color: per-group theming via CSS custom properties
   Type: Nunito body + Orbitron countdown digits
──────────────────────────────────────────────────────────── */
:root {
  --bg: #0d0d12;
  --bg2: #13131a;
  --surface: #1a1a24;
  --surface2: #22223a;
  --fg: #f0eeff;
  --fg-muted: #9994bb;
  --border: rgba(255,255,255,.08);

  /* group accent tokens — overridden per group */
  --accent: #ff3a5c;
  --accent2: #ff8fa0;
  --glow: rgba(255,58,92,.4);
  --group-bg: #1a0a10;
  --group-grad: linear-gradient(135deg, #2a0a10 0%, #1a0812 100%);
  --tab-glow: rgba(255,58,92,.6);

  color-scheme: dark;
}

/* intentionally single-theme (dark neon) — matches the K-pop night aesthetic */

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: 'Nunito', sans-serif;
  min-height: 100dvh;
  overflow-x: clip;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}

/* ── HEADER ─── */
.page-header {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 100;
  background: rgba(13,13,18,.92);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-bottom: 1px solid var(--border);
  padding: 14px 0 0;
  overflow: visible;
}
/* allow tab rail to scroll beyond header edges */
.tab-rail-wrapper {
  overflow: hidden;
  margin: 0 -4px;
  padding: 0 4px;
}

.header-top {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 4px 12px;
}

.header-emoji { font-size: 1.6rem; }

.header-title {
  font-family: 'Orbitron', monospace;
  font-size: clamp(1rem, 4vw, 1.35rem);
  font-weight: 900;
  background: linear-gradient(90deg, #f472b6, #c084fc, #818cf8);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: 1px;
  flex: 1;
}

.search-input {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  color: var(--fg);
  font-family: 'Nunito', sans-serif;
  font-size: .85rem;
  padding: 6px 14px;
  width: clamp(100px, 22vw, 160px);
  outline: none;
  transition: border-color .2s, box-shadow .2s;
}
.search-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--glow);
}

/* ── GROUP TAB RAIL ─── */
.tab-rail-wrapper {
  position: relative;
}
.tab-rail {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  overflow-y: visible;
  padding: 0 4px 10px;
  scrollbar-width: thin;
  scrollbar-color: rgba(255,255,255,.15) transparent;
  -webkit-overflow-scrolling: touch;
  scroll-snap-type: x proximity;
}
.tab-rail::-webkit-scrollbar { height: 3px; }
.tab-rail::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
.tab-rail::-webkit-scrollbar-track { background: transparent; }

.group-tab { scroll-snap-align: start; }

.group-tab {
  flex-shrink: 0;
  padding: 6px 16px;
  border-radius: 20px;
  border: 1.5px solid var(--border);
  background: transparent;
  color: var(--fg-muted);
  font-family: 'Nunito', sans-serif;
  font-size: .8rem;
  font-weight: 700;
  cursor: pointer;
  transition: all .2s;
  white-space: nowrap;
  letter-spacing: .5px;
}

.group-tab:hover {
  border-color: var(--tab-color, #f472b6);
  color: var(--tab-color, #f472b6);
  background: rgba(255,255,255,.04);
}

.group-tab.active {
  background: var(--tab-color, #f472b6);
  border-color: var(--tab-color, #f472b6);
  color: #fff;
  box-shadow: 0 0 16px var(--tab-glow, rgba(244,114,182,.5));
  font-weight: 900;
}

/* ── MAIN CONTENT ─── */
.main {
  padding-block: 24px;
  max-width: 1100px;
  margin: 0 auto;
}

/* ── GROUP HEADER BANNER ─── */
.group-banner {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 20px 24px;
  border-radius: 16px;
  background: var(--group-grad);
  border: 1px solid rgba(255,255,255,.06);
  margin-bottom: 24px;
  position: relative;
  overflow: hidden;
}

.group-banner::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at 80% 50%, var(--glow) 0%, transparent 70%);
  pointer-events: none;
}

.group-name {
  font-family: 'Orbitron', monospace;
  font-size: clamp(1.4rem, 5vw, 2.2rem);
  font-weight: 900;
  color: var(--accent2);
  text-shadow: 0 0 30px var(--glow);
  letter-spacing: 2px;
  text-wrap: balance;
}

.group-tagline {
  font-size: .85rem;
  color: var(--fg-muted);
  margin-top: 2px;
  font-style: italic;
}

.group-icon {
  font-size: clamp(2rem, 6vw, 3rem);
  flex-shrink: 0;
}

/* ── UPCOMING BANNER ─── */
.upcoming-banner {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding-bottom: 8px;
  margin-bottom: 24px;
  scrollbar-width: none;
}
.upcoming-banner::-webkit-scrollbar { display: none; }

.upcoming-pill {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
  color: #fff;
  border-radius: 24px;
  padding: 8px 16px;
  font-size: .8rem;
  font-weight: 800;
  box-shadow: 0 0 18px var(--glow);
  animation: pillPulse 2s ease-in-out infinite;
}

.upcoming-pill.today {
  animation: todayPulse 1s ease-in-out infinite;
  background: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%);
  box-shadow: 0 0 24px rgba(245,158,11,.6);
}

@keyframes pillPulse {
  0%,100% { box-shadow: 0 0 18px var(--glow); }
  50% { box-shadow: 0 0 32px var(--glow); }
}
@keyframes todayPulse {
  0%,100% { transform: scale(1); box-shadow: 0 0 24px rgba(245,158,11,.6); }
  50% { transform: scale(1.03); box-shadow: 0 0 40px rgba(245,158,11,.9); }
}

/* ── IDOL GRID ─── */
.idol-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 16px;
}

/* ── IDOL CARD ─── */
.idol-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px 16px 16px;
  text-align: center;
  transition: transform .2s, box-shadow .2s, border-color .2s;
  position: relative;
  overflow: hidden;
}

.idol-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  border-radius: 16px 16px 0 0;
}

.idol-card:hover {
  transform: translateY(-4px);
  border-color: var(--accent);
  box-shadow: 0 8px 32px var(--glow);
}

.idol-card.birthday-today {
  border-color: #f59e0b;
  box-shadow: 0 0 32px rgba(245,158,11,.5);
  animation: todayCardGlow 2s ease-in-out infinite;
}

.idol-card.birthday-soon {
  border-color: var(--accent);
  box-shadow: 0 0 20px var(--glow);
}

@keyframes todayCardGlow {
  0%,100% { box-shadow: 0 0 28px rgba(245,158,11,.5); }
  50% { box-shadow: 0 0 48px rgba(245,158,11,.8); }
}

.idol-avatar {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: var(--group-grad);
  border: 2.5px solid var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.8rem;
  margin: 0 auto 12px;
  box-shadow: 0 0 16px var(--glow);
}

.idol-card.birthday-today .idol-avatar {
  border-color: #f59e0b;
  box-shadow: 0 0 20px rgba(245,158,11,.7);
  animation: avatarSpin 3s linear infinite;
}

@keyframes avatarSpin {
  from { box-shadow: 0 0 20px rgba(245,158,11,.7), 0 0 0 2px #f59e0b; }
  50% { box-shadow: 0 0 40px rgba(245,158,11,1), 0 0 0 4px #fbbf24; }
  to { box-shadow: 0 0 20px rgba(245,158,11,.7), 0 0 0 2px #f59e0b; }
}

.idol-name {
  font-size: 1rem;
  font-weight: 800;
  color: var(--fg);
  margin-bottom: 2px;
}

.idol-position {
  font-size: .72rem;
  color: var(--fg-muted);
  letter-spacing: .5px;
  text-transform: uppercase;
  margin-bottom: 10px;
}

.birthday-badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 12px;
  font-size: .72rem;
  font-weight: 700;
  letter-spacing: .5px;
  margin-bottom: 12px;
}

.badge-today {
  background: rgba(245,158,11,.2);
  color: #f59e0b;
  border: 1px solid rgba(245,158,11,.4);
}

.badge-soon {
  background: rgba(var(--accent-rgb, 255,58,92),.15);
  color: var(--accent2);
  border: 1px solid rgba(var(--accent-rgb, 255,58,92),.3);
}

.badge-normal {
  background: rgba(255,255,255,.06);
  color: var(--fg-muted);
  border: 1px solid var(--border);
}

.countdown-display {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 4px;
  margin-top: 4px;
}

.countdown-unit {
  text-align: center;
}

.countdown-num {
  font-family: 'Orbitron', monospace;
  font-size: clamp(.9rem, 2.5vw, 1.05rem);
  font-weight: 700;
  color: var(--accent2);
  font-variant-numeric: tabular-nums;
  display: block;
  line-height: 1.1;
}

.idol-card.birthday-today .countdown-num {
  color: #fbbf24;
}

.countdown-label {
  font-size: .58rem;
  color: var(--fg-muted);
  text-transform: uppercase;
  letter-spacing: .5px;
}

.bday-date {
  font-size: .75rem;
  color: var(--fg-muted);
  margin-top: 8px;
}

/* section separator */
.section-label {
  font-size: .72rem;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--fg-muted);
  margin: 0 0 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.section-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

/* empty state */
.empty-state {
  text-align: center;
  padding: 48px 24px;
  color: var(--fg-muted);
  font-size: .9rem;
}

/* ── FOOTER ─── */
.page-footer {
  text-align: center;
  padding: 32px 0 24px;
  font-size: .75rem;
  color: var(--fg-muted);
  border-top: 1px solid var(--border);
  margin-top: 40px;
}

.page-footer a {
  color: var(--accent2);
  text-decoration: none;
}
</style>

// ── UTILITIES ─────────────────────────────────────────────
function today() {
  const now = new Date();
  return { y: now.getFullYear(), m: now.getMonth()+1, d: now.getDate() };
}

function nextBirthday(bday) {
  const t = today();
  const [, bm, bd] = bday;
  const now = new Date();
  let next = new Date(t.y, bm-1, bd);
  if (next < now) next = new Date(t.y+1, bm-1, bd);
  return next;
}

function daysUntil(bday) {
  const next = nextBirthday(bday);
  const now = new Date();
  const diff = next - now;
  return Math.ceil(diff / 86400000);
}

function isToday(bday) {
  const t = today();
  return bday[1] === t.m && bday[2] === t.d;
}

function isSoon(bday, days=14) {
  if (isToday(bday)) return false;
  return daysUntil(bday) <= days;
}

function formatBday([, m, d]) {
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${months[m-1]} ${d}`;
}

function getCountdown(bday) {
  const next = nextBirthday(bday);
  const now = new Date();
  let diff = next - now;
  if (diff < 0) diff = 0;
  const days = Math.floor(diff / 86400000);
  const hours = Math.floor((diff % 86400000) / 3600000);
  const mins = Math.floor((diff % 3600000) / 60000);
  const secs = Math.floor((diff % 60000) / 1000);
  return { days, hours, mins, secs };
}

function pad(n) { return String(n).padStart(2,'0'); }

// ── BUILD ALL-GROUP members list ─────────────────────────
function buildAllMembers() {
  const all = [];
  GROUPS.filter(g => g.id !== 'all').forEach(g => {
    g.members.forEach(m => all.push({ ...m, groupName: g.name, groupId: g.id }));
  });
  GROUPS[0].members = all;
}

// ── RENDER ────────────────────────────────────────────────
let activeGroup = 'all';
let timerIds = [];

function applyGroupTheme(g) {
  const r = document.documentElement.style;
  r.setProperty('--accent', g.theme.accent);
  r.setProperty('--accent2', g.theme.accent2);
  r.setProperty('--glow', g.theme.glow);
  r.setProperty('--group-bg', g.theme.groupBg);
  r.setProperty('--group-grad', g.theme.groupGrad);
  r.setProperty('--tab-glow', g.theme.tabGlow);
}

function renderTabs() {
  const rail = document.getElementById('tabRail');
  rail.innerHTML = '';
  GROUPS.forEach(g => {
    const btn = document.createElement('button');
    btn.className = 'group-tab' + (g.id === activeGroup ? ' active' : '');
    btn.style.setProperty('--tab-color', g.theme.tabColor);
    btn.textContent = g.name;
    btn.setAttribute('role','tab');
    btn.setAttribute('aria-selected', g.id === activeGroup);
    btn.addEventListener('click', () => { activeGroup = g.id; renderAll(); });
    rail.appendChild(btn);
  });
}

function renderGroup(group, searchQ = '') {
  const main = document.getElementById('mainContent');
  main.innerHTML = '';

  applyGroupTheme(group);

  // Banner
  const banner = document.createElement('div');
  banner.className = 'group-banner';
  banner.innerHTML = `
    <span class="group-icon" aria-hidden="true">${group.icon}</span>
    <div>
      <div class="group-name">${group.name}</div>
      <div class="group-tagline">${group.tagline}</div>
    </div>`;
  main.appendChild(banner);

  // Filter members
  let members = group.members;
  if (searchQ) {
    const q = searchQ.toLowerCase();
    members = members.filter(m => {
      const names = m.name.toLowerCase();
      const group = (m.groupName || '').toLowerCase();
      const pos = (m.pos || '').toLowerCase();
      // also support common alternate names / stage names
      const altNames = (m.altNames || []).map(n => n.toLowerCase());
      return names.includes(q) || group.includes(q) || pos.includes(q)
        || altNames.some(a => a.includes(q));
    });
  }

  if (!members.length) {
    main.insertAdjacentHTML('beforeend', '<div class="empty-state">No idols found 🔍</div>');
    return;
  }

  // Sort: today > soon > days remaining
  const sorted = [...members].sort((a,b) => {
    const aT = isToday(a.bday), bT = isToday(b.bday);
    if (aT && !bT) return -1; if (!aT && bT) return 1;
    return daysUntil(a.bday) - daysUntil(b.bday);
  });

  // Upcoming pills
  const upcomingMembers = sorted.filter(m => isToday(m.bday) || isSoon(m.bday));
  if (upcomingMembers.length) {
    const pillRow = document.createElement('div');
    pillRow.className = 'upcoming-banner';
    upcomingMembers.forEach(m => {
      const pill = document.createElement('div');
      pill.className = isToday(m.bday) ? 'upcoming-pill today' : 'upcoming-pill';
      const label = isToday(m.bday) ? '🎂 TODAY!' : `🎉 ${daysUntil(m.bday)}d`;
      const groupTag = m.groupName ? ` (${m.groupName})` : '';
      pill.innerHTML = `${label} ${m.name}${groupTag}`;
      pillRow.appendChild(pill);
    });
    main.appendChild(pillRow);
  }

  const p = document.createElement('p');
  p.className = 'section-label';
  p.textContent = `${members.length} idols`;
  main.appendChild(p);

  const grid = document.createElement('div');
  grid.className = 'idol-grid';

  sorted.forEach(m => {
    const card = document.createElement('div');
    card.className = 'idol-card' +
      (isToday(m.bday) ? ' birthday-today' : isSoon(m.bday) ? ' birthday-soon' : '');

    // For "all" group, find the group theme for the avatar border
    const memberGroup = m.groupId
      ? GROUPS.find(g => g.id === m.groupId)
      : group;
    const accent = memberGroup ? memberGroup.theme.accent : group.theme.accent;

    const groupTag = m.groupName
      ? `<div style="font-size:.68rem;color:${memberGroup?.theme?.accent2||'#ccc'};margin-bottom:2px;font-weight:700;">${m.groupName}</div>`
      : '';

    let badgeClass = 'badge-normal';
    let badgeText = formatBday(m.bday);
    if (isToday(m.bday)) { badgeClass = 'badge-today'; badgeText = '🎂 BIRTHDAY TODAY!'; }
    else if (isSoon(m.bday)) { badgeClass = 'badge-soon'; badgeText = `🎉 in ${daysUntil(m.bday)} days`; }

    const countdownId = `cd-${m.name.replace(/\s/g,'')}-${m.bday.join('')}`;

    card.innerHTML = `
      <div class="idol-avatar" style="border-color:${accent};box-shadow:0 0 16px ${memberGroup?.theme?.glow||'rgba(255,255,255,.2)'}">
        ${m.emoji}
      </div>
      ${groupTag}
      <div class="idol-name">${m.name}</div>
      <div class="idol-position">${m.pos}</div>
      <div class="birthday-badge ${badgeClass}">${badgeText}</div>
      ${isToday(m.bday)
        ? `<div style="font-size:1.4rem;animation:todayPulse 1s ease-in-out infinite">🎊🥳🎊</div>`
        : `<div class="countdown-display" id="${countdownId}">
            <div class="countdown-unit"><span class="countdown-num">--</span><span class="countdown-label">days</span></div>
            <div class="countdown-unit"><span class="countdown-num">--</span><span class="countdown-label">hrs</span></div>
            <div class="countdown-unit"><span class="countdown-num">--</span><span class="countdown-label">min</span></div>
            <div class="countdown-unit"><span class="countdown-num">--</span><span class="countdown-label">sec</span></div>
           </div>`}
      <div class="bday-date">🎂 ${m.bday[0]}  ·  ${formatBday(m.bday)}</div>`;

    grid.appendChild(card);
  });

  main.appendChild(grid);

  // Kick off countdowns
  timerIds.forEach(clearInterval);
  timerIds = [];

  function tick() {
    sorted.forEach(m => {
      if (isToday(m.bday)) return;
      const id = `cd-${m.name.replace(/\s/g,'')}-${m.bday.join('')}`;
      const el = document.getElementById(id);
      if (!el) return;
      const { days, hours, mins, secs } = getCountdown(m.bday);
      const nums = el.querySelectorAll('.countdown-num');
      nums[0].textContent = pad(days);
      nums[1].textContent = pad(hours);
      nums[2].textContent = pad(mins);
      nums[3].textContent = pad(secs);
    });
  }

  tick();
  timerIds.push(setInterval(tick, 1000));
}

function renderAll() {
  const searchQ = document.getElementById('searchInput').value.trim();
  const group = GROUPS.find(g => g.id === activeGroup) || GROUPS[0];
  renderTabs();
  renderGroup(group, searchQ);
}

// ── SEARCH ────────────────────────────────────────────────
document.getElementById('searchInput').addEventListener('input', () => {
  const q = document.getElementById('searchInput').value.trim();
  if (q) { activeGroup = 'all'; }
  renderAll();
});

// ── INIT ─────────────────────────────────────────────────
buildAllMembers();
renderAll();
</script>
